<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>omzugo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="glass" data-background="media/omloop1.mp4" data-softness="1.75" data-streaks="1" data-exposure="0.15" data-saturation="0.85" data-highlights="0.18" data-temperature="-0.35"></canvas>
  <p id="hint">Drag to draw</p>
  <div id="rain-control">
    <input id="rain" type="range" min="0" max="1.5" step="0.01" aria-label="Rain intensity">
  </div>
  <div id="loader" role="status" aria-label="Loading">
    <div class="loader-bar"><div class="loader-fill"></div></div>
  </div>
  <div id="cursor" hidden></div>
  <script src="main.js"></script>
</body>
</html>
